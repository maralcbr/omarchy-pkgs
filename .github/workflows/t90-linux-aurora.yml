name: Test build linux-aurora (ticket 90)

# Test lane only: unsigned Actions artifact. No secrets, no release, no
# repository database, no channel.
on:
  push:
    branches: [lab/90-linux-aurora-dpms]
    paths: [lab/t90-linux-aurora/**, .github/workflows/t90-linux-aurora.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t90-linux-aurora-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          docker system prune -af >/dev/null || true
          df -h / /mnt || true
      - name: Build in a disposable Arch Linux ARM container
        shell: bash
        run: |
          set -euo pipefail
          docker pull menci/archlinuxarm:base-devel
          docker run --rm -v "$PWD:/w" -w /w menci/archlinuxarm:base-devel \
            lab/t90-linux-aurora/build /w/t90-out 2>&1 | tee t90-build.log
          df -h /
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-aurora-t90-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            t90-build.log
            t90-out/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
