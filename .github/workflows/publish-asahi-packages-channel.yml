name: Publish Apple Silicon package channel

on:
  workflow_dispatch:
    inputs:
      stable_tag:
        description: Promoted asahi-packages-stable-<commit> release to publish as the next package channel, or to repair
        required: true
        type: string
      replace_malformed_pointer:
        description: Replace a malformed package channel pointer object
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: asahi-quattro-release
  cancel-in-progress: false

env:
  RELEASE_KEY_FINGERPRINT: 5983B1CA32CB778F4D74D24ECFF35022CA5B5959

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    environment: asahi-quattro-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate inputs
        env:
          STABLE_TAG: ${{ inputs.stable_tag }}
        run: |
          set -euo pipefail
          [[ $STABLE_TAG =~ ^asahi-packages-stable-[0-9a-f]{40}$ ]]
          [[ $GITHUB_REF == "refs/heads/asahi-quattro" ]]
          [[ $(git rev-parse HEAD) == "$GITHUB_SHA" ]]
          [[ $(git rev-parse --is-shallow-repository) == "false" ]]
          test/asahi-channel-pointer
          test/asahi-packages-channel
      - name: Verify immutable source and release key
        run: |
          set -euo pipefail
          SOURCE_COMMIT=$(sed -n 's/^OMARCHY_SOURCE_COMMIT=//p' pkgbuilds/omarchy-source.conf)
          [[ $SOURCE_COMMIT =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none --no-checkout https://github.com/maralcbr/omarchy-mx-mac.git /tmp/omarchy-quattro
          git -C /tmp/omarchy-quattro fetch origin main "$SOURCE_COMMIT"
          git -C /tmp/omarchy-quattro merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          git -C /tmp/omarchy-quattro checkout --detach "$SOURCE_COMMIT"
          mapfile -t primary_fingerprints < <(
            gpg --batch --show-keys --with-colons /tmp/omarchy-quattro/default/omarchy-release.gpg |
              awk -F: '$1 == "pub" { primary=1; next } primary && $1 == "fpr" { print $10; primary=0 }'
          )
          (( ${#primary_fingerprints[@]} == 1 ))
          [[ ${primary_fingerprints[0]} == "$RELEASE_KEY_FINGERPRINT" ]]
      - name: Import release signing key
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.OMARCHY_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_PRIVATE_KEY" | gpg --batch --import
          mapfile -t secret_fingerprints < <(
            gpg --batch --list-secret-keys --with-colons |
              awk -F: '$1 == "sec" { primary=1; next } primary && $1 == "fpr" { print $10; primary=0 }'
          )
          (( ${#secret_fingerprints[@]} == 1 ))
          [[ ${secret_fingerprints[0]} == "$RELEASE_KEY_FINGERPRINT" ]]
      - name: Publish package channel
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_PASSPHRASE: ${{ secrets.OMARCHY_RELEASE_KEY_PASSPHRASE }}
          STABLE_TAG: ${{ inputs.stable_tag }}
          REPLACE_MALFORMED_POINTER: ${{ inputs.replace_malformed_pointer }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          .github/scripts/install-aws-cli.sh
          options=(--keyring /tmp/omarchy-quattro/default/omarchy-release.gpg --signing-key keys/asahi-repository-signing.asc)
          if [[ $REPLACE_MALFORMED_POINTER == "true" ]]; then
            options+=(--replace-malformed-pointer)
          fi
          bin/publish-asahi-packages-channel "$STABLE_TAG" "${options[@]}"
