name: Publish Apple Silicon package repository

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify only or publish an immutable signed repository
        required: true
        default: verify
        type: choice
        options:
          - verify
          - publish

permissions:
  contents: read

concurrency:
  group: ${{ inputs.mode == 'publish' && 'asahi-package-repository' || format('asahi-package-verify-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.mode != 'publish' }}

env:
  RELEASE_KEY_FINGERPRINT: 5983B1CA32CB778F4D74D24ECFF35022CA5B5959

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Validate publication boundary
        run: |
          set -euo pipefail
          test/asahi-package-repository
          if [[ '${{ inputs.mode }}' == 'publish' ]]; then
            [[ $GITHUB_REF == 'refs/heads/asahi-quattro' ]]
          fi
      - name: Install package repository tools
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools pacman-package-manager
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prepare cached ARM package builder
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: build
          file: build/Dockerfile
          platforms: linux/arm64
          build-args: MIRROR=edge
          load: true
          tags: omarchy-pkg-builder:latest-aarch64-edge
          cache-from: type=gha,scope=asahi-builder-aarch64-edge-v1
          cache-to: type=gha,mode=max,scope=asahi-builder-aarch64-edge-v1
      - name: Build reviewed package sources
        run: |
          set -euo pipefail
          sources=$(paste -sd' ' pkgbuilds/asahi-repository-sources)
          OMARCHY_SKIP_BUILDER_IMAGE=1 bin/build --arch aarch64 --package $sources
      - name: Collect exact binary package set
        run: |
          set -euo pipefail
          mkdir /tmp/asahi-repository
          find build-output/edge/aarch64 -maxdepth 1 -type f -name '*.pkg.tar.*' ! -name '*.sig' \
            -exec cp {} /tmp/asahi-repository/ \;
          for archive in /tmp/asahi-repository/*.pkg.tar.*; do
            sanitized=${archive//:/-}
            [[ $sanitized == "$archive" ]] || mv "$archive" "$sanitized"
          done
          [[ -z $(find /tmp/asahi-repository -maxdepth 1 -type f -name '*[:"<>|?*]*' -print -quit) ]]
          find /tmp/asahi-repository -maxdepth 1 -type f -name '*.pkg.tar.*' -print0 |
            while IFS= read -r -d '' archive; do
              bsdtar -xOf "$archive" .PKGINFO | sed -n 's/^pkgname = //p'
            done | sort > /tmp/actual-packages
          sort pkgbuilds/asahi-repository-packages > /tmp/expected-packages
          diff -u /tmp/expected-packages /tmp/actual-packages
          (( $(find /tmp/asahi-repository -maxdepth 1 -type f | wc -l) == 21 ))
      - name: Create and install the repository transaction
        run: |
          set -euo pipefail
          repo-add /tmp/asahi-repository/omarchy.db.tar.zst /tmp/asahi-repository/*.pkg.tar.*
          cat >/tmp/asahi-repository/pacman.conf <<'EOF'
          [options]
          Architecture = aarch64
          SigLevel = Never

          [omarchy]
          Server = file:///repo

          [core]
          Include = /etc/pacman.d/mirrorlist

          [extra]
          Include = /etc/pacman.d/mirrorlist

          [alarm]
          Include = /etc/pacman.d/mirrorlist

          [aur]
          Include = /etc/pacman.d/mirrorlist
          EOF
          packages=$(paste -sd' ' pkgbuilds/asahi-repository-packages)
          docker run --rm \
            -v /tmp/asahi-repository:/repo:ro \
            omarchy-pkg-builder:latest-aarch64-edge \
            /bin/bash -c "sudo pacman -Syu --noconfirm --config /repo/pacman.conf $packages"
          rm /tmp/asahi-repository/omarchy.db /tmp/asahi-repository/omarchy.db.tar.zst \
            /tmp/asahi-repository/omarchy.files /tmp/asahi-repository/omarchy.files.tar.zst \
            /tmp/asahi-repository/pacman.conf
      - name: Upload verified repository packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asahi-package-repository
          path: /tmp/asahi-repository/*.pkg.tar.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    if: inputs.mode == 'publish'
    needs: build
    runs-on: ubuntu-24.04-arm
    environment: asahi-quattro-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: asahi-package-repository
          path: /tmp/asahi-repository
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools pacman-package-manager
      - name: Import and validate release key
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.OMARCHY_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_PRIVATE_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --list-secret-keys --with-colons |
            awk -F: '$1 == "sec" { primary=1; next } primary && $1 == "fpr" { print $10; exit }')
          [[ $fingerprint == "$RELEASE_KEY_FINGERPRINT" ]]
      - name: Sign packages and repository database
        env:
          GPG_PASSPHRASE: ${{ secrets.OMARCHY_RELEASE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd /tmp/asahi-repository
          for archive in *.pkg.tar.*; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --detach-sign "$archive"
            gpg --batch --verify "$archive.sig" "$archive"
          done
          archives=()
          for archive in *.pkg.tar.*; do
            [[ $archive == *.sig ]] || archives+=("$archive")
          done
          (( ${#archives[@]} == 21 ))
          repo-add omarchy.db.tar.zst "${archives[@]}"
          for database in omarchy.db.tar.zst omarchy.files.tar.zst; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --detach-sign "$database"
            gpg --batch --verify "$database.sig" "$database"
          done
          cp --remove-destination omarchy.db.tar.zst omarchy.db
          cp --remove-destination omarchy.db.tar.zst.sig omarchy.db.sig
          cp --remove-destination omarchy.files.tar.zst omarchy.files
          cp --remove-destination omarchy.files.tar.zst.sig omarchy.files.sig
          sha256sum *.pkg.tar.* omarchy.db omarchy.db.sig omarchy.files omarchy.files.sig >SHA256SUMS
      - name: Publish immutable package repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ADMIN_TOKEN: ${{ secrets.OMARCHY_REPOSITORY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="asahi-packages-$GITHUB_SHA"
          [[ $release_tag == "asahi-packages-$GITHUB_SHA" ]]
          [[ -n $REPOSITORY_ADMIN_TOKEN ]]
          [[ $(GH_TOKEN="$REPOSITORY_ADMIN_TOKEN" gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled) == "true" ]]
          ! gh release view "$release_tag" >/dev/null 2>&1
          gh release create "$release_tag" \
            /tmp/asahi-repository/*.pkg.tar.* \
            /tmp/asahi-repository/omarchy.db /tmp/asahi-repository/omarchy.db.sig \
            /tmp/asahi-repository/omarchy.files /tmp/asahi-repository/omarchy.files.sig \
            /tmp/asahi-repository/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Apple Silicon packages $GITHUB_SHA" \
            --notes "Immutable signed aarch64 pacman repository from $GITHUB_SHA." \
            --latest=false
          [[ $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" --jq .immutable) == "true" ]]
          gh release verify "$release_tag"
      - name: Verify public repository assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="asahi-packages-$GITHUB_SHA"
          mkdir /tmp/public-repository
          gh release download "$release_tag" --dir /tmp/public-repository
          cd /tmp/public-repository
          sha256sum --check SHA256SUMS
          (( $(find . -maxdepth 1 -type f -name '*.pkg.tar.*' ! -name '*.sig' | wc -l) == 21 ))
