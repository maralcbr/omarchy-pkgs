name: Build Aurora edge kernel release

# The Aurora edge channel follows aurora-silicon/linux aurora-wip. Each run is
# edge sequence N = its run number: it resolves the head of aurora-wip once,
# builds linux-aurora from it with pkgbuilds/linux-aurora-edge, carries the rc
# pin's m1n1-aurora unchanged, and publishes release aurora-edge-N and the
# pointer pointers/aurora-edge-channel. The rc pin, the aurora-packages
# releases and the [omarchy] repository are never touched.
#
# A run builds only when its inputs changed: once the source is resolved and
# the builder image is ready, bin/aurora-kernel-input-digest records every
# build input in INPUTS, and when the latest published edge release verifies
# and records the same input digest the run ends with nothing new (nothing is
# built, signed or published). Anything that cannot be proven equal builds.
# force builds anyway, as the new sequence N; no sequence is ever published
# twice.
#
# Publication is not idempotent: once aurora-edge-N exists (even as a draft), a
# re-run of this run is refused. If only the pointer step failed, run
# publish-asahi-channel-pointer.yml with kind aurora-edge and sequence N;
# otherwise delete what was left and dispatch a new run.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish aurora-edge-<run number> and move the edge pointer after the build passes
        required: true
        default: false
        type: boolean
      force:
        description: Build a new edge sequence even when the latest edge release was built from the same inputs
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aurora-edge
  cancel-in-progress: false
  queue: max

env:
  PERSONAL_RELEASE_MASTER_FINGERPRINT: 5983B1CA32CB778F4D74D24ECFF35022CA5B5959

jobs:
  signing-check:
    # Only a run that has something new to publish asks for the release environment.
    needs: build
    if: inputs.publish && needs.build.outputs.build == 'true'
    runs-on: ubuntu-latest
    environment: asahi-quattro-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate dedicated signing subkey and immutable releases
        env:
          ARM_REPOSITORY_SIGNING_SUBKEY: ${{ secrets.OMARCHY_ARM_REPOSITORY_SIGNING_SUBKEY }}
          ARM_REPOSITORY_SIGNING_FINGERPRINT: ${{ vars.OMARCHY_ARM_REPOSITORY_SIGNING_FINGERPRINT }}
          GPG_PASSPHRASE: ${{ secrets.OMARCHY_ARM_REPOSITORY_SIGNING_PASSPHRASE }}
          REPOSITORY_ADMIN_TOKEN: ${{ secrets.OMARCHY_REPOSITORY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          [[ ${ARM_REPOSITORY_SIGNING_FINGERPRINT^^} =~ ^[A-F0-9]{40}$ ]]
          printf '%s' "$ARM_REPOSITORY_SIGNING_SUBKEY" | gpg --batch --import
          bin/asahi-signing-subkey-validate "${ARM_REPOSITORY_SIGNING_FINGERPRINT^^}" "$PERSONAL_RELEASE_MASTER_FINGERPRINT"
          [[ $GITHUB_REF == 'refs/heads/asahi-quattro' ]]
          [[ $(GH_TOKEN="$REPOSITORY_ADMIN_TOKEN" gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled) == "true" ]]

  source:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      sha256: ${{ steps.source.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the edge lane tools
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install --yes libarchive-tools pacman-package-manager
          test/aurora-package-descriptor
          test/aurora-kernel-input-digest
          test/aurora-edge-release
      - name: Resolve aurora-wip once for this run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SEQUENCE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir /tmp/aurora-edge-source
          bin/aurora-edge-source /tmp/aurora-edge-source "$SEQUENCE" | tee -a "$GITHUB_OUTPUT"
      - if: steps.source.outputs.upload == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aurora-edge-source
          path: /tmp/aurora-edge-source/source
          if-no-files-found: error
          retention-days: 31

  build:
    needs: source
    runs-on: ubuntu-24.04-arm
    # A kernel build with Rust enabled runs far longer than a normal package.
    timeout-minutes: 330
    outputs:
      build: ${{ steps.gate.outputs.build }}
      input_digest: ${{ steps.gate.outputs.input_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: build
          file: build/Dockerfile
          platforms: linux/arm64
          build-args: MIRROR=edge
          load: true
          tags: omarchy-pkg-builder:latest-aarch64-edge
          cache-from: type=gha,scope=asahi-builder-aarch64-edge-v2
          # Written back so the next run finds the same builder image.
          cache-to: type=gha,mode=max,scope=asahi-builder-aarch64-edge-v2
      - name: Pin the recipe to the resolved source
        env:
          COMMIT: ${{ needs.source.outputs.commit }}
          SOURCE_SHA256: ${{ needs.source.outputs.sha256 }}
          SEQUENCE: ${{ github.run_number }}
        run: bin/aurora-edge-pin-recipe pkgbuilds/linux-aurora-edge "$COMMIT" "$SOURCE_SHA256" "$SEQUENCE"
      - name: Record the build inputs and compare them with the latest edge release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.source.outputs.commit }}
          SOURCE_SHA256: ${{ needs.source.outputs.sha256 }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          bin/aurora-verify-edge-release rc >/tmp/rc-pin
          m1n1_file=$(sed -n 's/^m1n1_aurora_file=//p' /tmp/rc-pin)
          m1n1_sha256=$(sed -n 's/^m1n1_aurora_sha256=//p' /tmp/rc-pin)
          image=$(docker image inspect --format '{{.Id}}' omarchy-pkg-builder:latest-aarch64-edge)
          bin/aurora-kernel-input-digest dependencies "$image" pkgbuilds/linux-aurora-edge >/tmp/dependencies
          mkdir /tmp/inputs
          bin/aurora-kernel-input-digest edge /tmp/inputs/INPUTS --aurora-commit "$COMMIT" --source-sha256 "$SOURCE_SHA256" \
            --m1n1-file "$m1n1_file" --m1n1-sha256 "$m1n1_sha256" --builder-image "$image" --dependencies /tmp/dependencies |
            tee /tmp/digest >>"$GITHUB_OUTPUT"
          cat /tmp/inputs/INPUTS
          force=()
          [[ $FORCE != true ]] || force=(--force)
          bin/aurora-verify-edge-release gate edge "$(sed -n 's/^input_digest=//p' /tmp/digest)" "${force[@]}" | tee -a "$GITHUB_OUTPUT" >/tmp/gate
          cat /tmp/digest /tmp/gate
          sed -n 's/^reason=/Aurora edge: /p' /tmp/gate >>"$GITHUB_STEP_SUMMARY"
      - name: Keep the pinned recipe and generate its metadata
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          mkdir recipe
          cp pkgbuilds/linux-aurora-edge/PKGBUILD recipe/PKGBUILD
          docker run --rm -v "$PWD/pkgbuilds/linux-aurora-edge:/recipe:ro" omarchy-pkg-builder:latest-aarch64-edge \
            bash -c 'cp -r /recipe /tmp/recipe && chmod -R u+w /tmp/recipe && cd /tmp/recipe && makepkg --printsrcinfo' >recipe/SRCINFO
          [[ $(head -1 recipe/SRCINFO) == 'pkgbase = linux-aurora' ]]
      - name: Build the Aurora edge kernel
        if: steps.gate.outputs.build == 'true'
        run: OMARCHY_SKIP_BUILDER_IMAGE=1 bin/build --arch aarch64 --package linux-aurora-edge
      - name: Collect exact kernel outputs
        if: steps.gate.outputs.build == 'true'
        env:
          SEQUENCE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir output
          sudo apt-get update && sudo apt-get install --yes libarchive-tools
          outputs=$(awk -F'|' '$1 == "linux-aurora" { print $2 }' pkgbuilds/aurora-source-outputs)
          for package in $outputs; do
            archives=()
            while IFS= read -r -d '' archive; do
              bsdtar -xOqf "$archive" .PKGINFO | grep -Fxq "pkgname = $package" && archives+=("$archive")
            done < <(find build-output/edge/aarch64 -maxdepth 1 -type f -name '*.pkg.tar.*' ! -name '*.sig' -print0)
            (( ${#archives[@]} == 1 ))
            bsdtar -xOqf "${archives[0]}" .PKGINFO | grep -Eqx "pkgver = [0-9]+\.[0-9]+\.[0-9]+\.aurora[0-9]+\.$SEQUENCE-1"
            cp "${archives[0]}" "output/$(basename "${archives[0]}")"
          done
          cp recipe/PKGBUILD recipe/SRCINFO /tmp/inputs/INPUTS output/
          (( $(find output -type f | wc -l) == 5 ))
      - if: steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aurora-edge-packages
          path: output
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  publish:
    if: >-
      ${{ !cancelled() && inputs.publish &&
          needs.signing-check.result == 'success' &&
          needs.source.result == 'success' &&
          needs.build.result == 'success' &&
          needs.build.outputs.build == 'true' }}
    needs: [signing-check, source, build]
    runs-on: ubuntu-24.04-arm
    environment: asahi-quattro-release
    permissions:
      contents: write
    env:
      SEQUENCE: ${{ github.run_number }}
      COMMIT: ${{ needs.source.outputs.commit }}
      SOURCE_SHA256: ${{ needs.source.outputs.sha256 }}
      INPUT_DIGEST: ${{ needs.build.outputs.input_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aurora-edge-packages
          path: /tmp/aurora
      - name: Carry the rc pin's m1n1-aurora unchanged
        env:
          GH_TOKEN: ${{ secrets.OMARCHY_REPOSITORY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install --yes libarchive-tools pacman-package-manager
          mkdir /tmp/release
          cp -a /tmp/aurora/. /tmp/release/
          bin/aurora-verify-edge-release rc --m1n1-dir /tmp/release
      - name: Sign the kernel, build its repository and emit provenance
        env:
          ARM_REPOSITORY_SIGNING_SUBKEY: ${{ secrets.OMARCHY_ARM_REPOSITORY_SIGNING_SUBKEY }}
          ARM_REPOSITORY_SIGNING_FINGERPRINT: ${{ vars.OMARCHY_ARM_REPOSITORY_SIGNING_FINGERPRINT }}
          GPG_PASSPHRASE: ${{ secrets.OMARCHY_ARM_REPOSITORY_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '%s' "$ARM_REPOSITORY_SIGNING_SUBKEY" | gpg --batch --import
          fingerprint=${ARM_REPOSITORY_SIGNING_FINGERPRINT^^}
          bin/asahi-signing-subkey-validate "$fingerprint" "$PERSONAL_RELEASE_MASTER_FINGERPRINT"
          # Only the kernel is signed here; m1n1-aurora keeps the rc pin's signature.
          # PKGBUILD and SRCINFO, the pinned recipe and its metadata, and INPUTS, the build's input
          # record, are bound by their hashes in AURORA.
          for archive in /tmp/aurora/*.pkg.tar.*; do
            archive=/tmp/release/${archive##*/}
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$fingerprint!" --detach-sign "$archive"
            gpg --batch --verify "$archive.sig" "$archive"
          done
          # repo-add rejects the detached signatures the glob would drag in.
          (
            cd /tmp/release
            archives=()
            for archive in *.pkg.tar.*; do
              [[ $archive == *.sig ]] || archives+=("$archive")
            done
            (( ${#archives[@]} == $(wc -l <"$GITHUB_WORKSPACE/pkgbuilds/aurora-repository-packages") ))
            repo-add omarchy-aurora.db.tar.zst "${archives[@]}"
          )
          for database in omarchy-aurora.db.tar.zst omarchy-aurora.files.tar.zst; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$fingerprint!" --detach-sign "/tmp/release/$database"
          done
          cp --remove-destination /tmp/release/omarchy-aurora.db.tar.zst /tmp/release/omarchy-aurora.db
          cp --remove-destination /tmp/release/omarchy-aurora.db.tar.zst.sig /tmp/release/omarchy-aurora.db.sig
          cp --remove-destination /tmp/release/omarchy-aurora.files.tar.zst /tmp/release/omarchy-aurora.files
          cp --remove-destination /tmp/release/omarchy-aurora.files.tar.zst.sig /tmp/release/omarchy-aurora.files.sig
          rm /tmp/release/omarchy-aurora.db.tar.zst /tmp/release/omarchy-aurora.db.tar.zst.sig /tmp/release/omarchy-aurora.files.tar.zst /tmp/release/omarchy-aurora.files.tar.zst.sig
          bin/aurora-package-descriptor /tmp/release "aurora-edge-$SEQUENCE" "$GITHUB_SHA" "$fingerprint" "$GITHUB_RUN_ID" \
            --sequence "$SEQUENCE" --aurora-commit "$COMMIT" --source-sha256 "$SOURCE_SHA256" \
            --input-digest "$INPUT_DIGEST" >/tmp/release/AURORA
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$fingerprint!" --detach-sign /tmp/release/AURORA
          cp keys/asahi-repository-signing.asc /tmp/release/
          (cd /tmp/release && sha256sum *.pkg.tar.* omarchy-aurora.db omarchy-aurora.db.sig omarchy-aurora.files omarchy-aurora.files.sig AURORA AURORA.sig asahi-repository-signing.asc PKGBUILD SRCINFO INPUTS >SHA256SUMS)
          sha256sum /tmp/release/AURORA
      # Refuses a kernel that is not newer than the previous edge release and the rc pin.
      # The design's remedy for a base or _aurorarel regression, a manual epoch bump,
      # does not work yet: an epoch puts ':' into the archive names, which
      # bin/aurora-package-descriptor rejects.
      - name: Refuse anything but the next edge release
        env:
          GH_TOKEN: ${{ secrets.OMARCHY_REPOSITORY_ADMIN_TOKEN }}
        run: bin/aurora-verify-edge-release next /tmp/release/AURORA
      - name: Publish the immutable edge release
        env:
          GH_TOKEN: ${{ secrets.OMARCHY_REPOSITORY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          tag="aurora-edge-$SEQUENCE"
          gh release create "$tag" /tmp/release/* --target "$GITHUB_SHA" --title "Aurora edge kernel $SEQUENCE" \
            --notes "Signed Aurora edge kernel built from aurora-silicon/linux $COMMIT. See AURORA." --latest=false
          bin/aurora-verify-edge-release edge "$SEQUENCE" --complete
      - name: Publish edge channel pointer
        env:
          GH_TOKEN: ${{ secrets.OMARCHY_REPOSITORY_ADMIN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          .github/scripts/install-aws-cli.sh
          bin/publish-asahi-channel-pointer "$SEQUENCE" --kind aurora-edge --signing-key keys/asahi-repository-signing.asc
