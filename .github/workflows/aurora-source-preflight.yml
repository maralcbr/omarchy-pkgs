name: Aurora source preflight
on:
  push:
    branches: [release/aurora-tb-20260913]
    paths: [.github/workflows/aurora-source-preflight.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and hash pinned Aurora tb source
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 60 https://github.com/aurora-silicon/linux/archive/38c14f6107dfdb3366dee3cdfc3226cf4cda9ca2.tar.gz -o aurora-source.tar.gz
          sha256sum aurora-source.tar.gz | tee SHA256SUMS
          tar -xOf aurora-source.tar.gz linux-38c14f6107dfdb3366dee3cdfc3226cf4cda9ca2/Makefile | head -8 || test "${PIPESTATUS[0]}" = 141
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aurora-source-38c14f61
          path: |
            aurora-source.tar.gz
            SHA256SUMS
          compression-level: 0
          retention-days: 1
