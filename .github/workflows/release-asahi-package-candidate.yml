name: Build or publish Apple Silicon package candidate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check signing credentials, verify packages, or publish a candidate
        required: true
        default: verify
        type: choice
        options:
          - signing-check
          - verify
          - publish

permissions:
  contents: read

concurrency:
  group: ${{ inputs.mode == 'publish' && 'asahi-package-repository' || format('asahi-package-verify-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.mode != 'publish' }}

env:
  EXPECTED_SOURCE_COUNT: 24
  EXPECTED_PACKAGE_COUNT: 33
  EXPECTED_RUNTIME_PACKAGE_COUNT: 6
  PERSONAL_RELEASE_MASTER_FINGERPRINT: 5983B1CA32CB778F4D74D24ECFF35022CA5B5959
  PREVIOUS_PACKAGE_RELEASE: asahi-packages-784daa3efaecfa81b5b4da888b524e6ec4574d24

jobs:
  signing-check:
    if: inputs.mode == 'signing-check'
    runs-on: ubuntu-latest
    environment: asahi-quattro-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Validate dedicated ARM signing credentials
        env:
          ARM_REPOSITORY_SIGNING_SUBKEY: ${{ secrets.OMARCHY_ARM_REPOSITORY_SIGNING_SUBKEY }}
          ARM_REPOSITORY_SIGNING_FINGERPRINT: ${{ vars.OMARCHY_ARM_REPOSITORY_SIGNING_FINGERPRINT }}
          GPG_PASSPHRASE: ${{ secrets.OMARCHY_ARM_REPOSITORY_SIGNING_PASSPHRASE }}
          REPOSITORY_ADMIN_TOKEN: ${{ secrets.OMARCHY_REPOSITORY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          [[ ${ARM_REPOSITORY_SIGNING_FINGERPRINT^^} =~ ^[A-F0-9]{40}$ ]]
          [[ -n $ARM_REPOSITORY_SIGNING_SUBKEY && -n $GPG_PASSPHRASE ]]
          printf '%s' "$ARM_REPOSITORY_SIGNING_SUBKEY" | gpg --batch --import
          bin/asahi-signing-subkey-validate \
            "${ARM_REPOSITORY_SIGNING_FINGERPRINT^^}" \
            "$PERSONAL_RELEASE_MASTER_FINGERPRINT"
          [[ -n $REPOSITORY_ADMIN_TOKEN ]]
          if ! immutable_enabled=$(GH_TOKEN="$REPOSITORY_ADMIN_TOKEN" gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled); then
            echo "::error::OMARCHY_REPOSITORY_ADMIN_TOKEN must be valid and have Administration read permission" >&2
            exit 1
          fi
          if [[ $immutable_enabled != "true" ]]; then
            echo "::error::Immutable releases must be enabled before candidate publication" >&2
            exit 1
          fi

  plan:
    if: inputs.mode != 'signing-check'
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.matrix.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Install descriptor test tools
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools
      - name: Validate publication boundary
        run: |
          set -euo pipefail
          test/asahi-package-repository
          test/asahi-package-candidate-descriptor
          if [[ '${{ inputs.mode }}' == 'publish' ]]; then
            [[ $GITHUB_REF == 'refs/heads/asahi-quattro' ]]
          fi
      - name: Generate source matrix
        id: matrix
        run: |
          set -euo pipefail
          sources=$(jq -R -s -c 'split("\n") | map(select(length > 0))' <pkgbuilds/asahi-repository-sources)
          [[ $(jq length <<<"$sources") == "$EXPECTED_SOURCE_COUNT" ]]
          echo "sources=$sources" >>"$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Install package repository tools
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools pacman-package-manager
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prepare cached ARM package builder
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: build
          file: build/Dockerfile
          platforms: linux/arm64
          build-args: MIRROR=edge
          load: true
          tags: omarchy-pkg-builder:latest-aarch64-edge
          cache-from: type=gha,scope=asahi-builder-aarch64-edge-v1
          cache-to: type=gha,mode=max,scope=asahi-builder-aarch64-edge-v1
      - name: Build one reviewed package source
        run: |
          set -euo pipefail
          grep -Fxq '${{ matrix.source }}' pkgbuilds/asahi-repository-sources
          OMARCHY_SKIP_BUILDER_IMAGE=1 bin/build --arch aarch64 --package '${{ matrix.source }}'
      - name: Collect source package outputs
        run: |
          set -euo pipefail
          mkdir /tmp/asahi-source
          while IFS= read -r -d '' archive; do
            package=$(bsdtar -xOf "$archive" .PKGINFO | sed -n 's/^pkgname = //p')
            grep -Fxq "$package" pkgbuilds/asahi-repository-packages || continue
            cp "$archive" /tmp/asahi-source/
          done < <(find build-output/edge/aarch64 -maxdepth 1 -type f \
            -name '*.pkg.tar.*' ! -name '*.sig' -print0)
          shopt -s nullglob
          archives=(/tmp/asahi-source/*.pkg.tar.*)
          (( ${#archives[@]} > 0 ))
          for archive in "${archives[@]}"; do
            sanitized=${archive//:/-}
            [[ $sanitized == "$archive" ]] || mv "$archive" "$sanitized"
            architecture=$(bsdtar -xOf "$sanitized" .PKGINFO | sed -n 's/^arch = //p')
            [[ $architecture == "aarch64" || $architecture == "any" ]]
          done
          [[ -z $(find /tmp/asahi-source -maxdepth 1 -type f -name '*[:"<>|?*]*' -print -quit) ]]
      - name: Upload source package outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asahi-source-${{ matrix.source }}
          path: /tmp/asahi-source/*.pkg.tar.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-runtime:
    needs: plan
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: source-pair
            packages: omarchy-settings-dev omarchy-dev
          - group: omarchy-keyring
            packages: omarchy-keyring
          - group: omarchy-nvim
            packages: omarchy-nvim
          - group: quickshell-git
            packages: quickshell-git
          - group: ttf-jetbrains-mono-nerd-basic
            packages: ttf-jetbrains-mono-nerd-basic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Clone immutable Omarchy runtime source
        if: matrix.group == 'source-pair'
        run: |
          set -euo pipefail
          source pkgbuilds/omarchy-source.conf
          git check-ref-format --branch "$OMARCHY_SOURCE_REF"
          [[ $OMARCHY_SOURCE_COMMIT =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none --no-checkout https://github.com/maralcbr/omarchy-mx-mac.git /tmp/omarchy-quattro
          git -C /tmp/omarchy-quattro fetch origin "$OMARCHY_SOURCE_REF" "$OMARCHY_SOURCE_COMMIT"
          git -C /tmp/omarchy-quattro merge-base --is-ancestor "$OMARCHY_SOURCE_COMMIT" "origin/$OMARCHY_SOURCE_REF"
          git -C /tmp/omarchy-quattro checkout --detach "$OMARCHY_SOURCE_COMMIT"
          chmod -R a+rX /tmp/omarchy-quattro
      - name: Install runtime package tools
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools pacman-package-manager
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prepare cached ARM package builder
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: build
          file: build/Dockerfile
          platforms: linux/arm64
          build-args: MIRROR=edge
          load: true
          tags: omarchy-pkg-builder:latest-aarch64-edge
          cache-from: type=gha,scope=asahi-builder-aarch64-edge-v1
          cache-to: type=gha,mode=max,scope=asahi-builder-aarch64-edge-v1
      - name: Build one runtime package group
        env:
          GROUP: ${{ matrix.group }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          if [[ $GROUP == "source-pair" ]]; then
            OMARCHY_SRC=/tmp/omarchy-quattro \
              OMARCHY_DEFER_RUNTIME_DEPS=true \
              OMARCHY_SKIP_BUILDER_IMAGE=1 \
              bin/build --arch aarch64 --package $PACKAGES
          else
            OMARCHY_SKIP_BUILDER_IMAGE=1 bin/build --arch aarch64 --package $PACKAGES
          fi
      - name: Collect exact runtime package group
        env:
          GROUP: ${{ matrix.group }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          mkdir /tmp/asahi-runtime
          for package in $PACKAGES; do
            shopt -s nullglob
            matches=(build-output/edge/aarch64/"$package"-*.pkg.tar.*)
            archives=()
            for archive in "${matches[@]}"; do
              [[ $archive == *.sig ]] || archives+=("$archive")
            done
            (( ${#archives[@]} == 1 ))
            destination="/tmp/asahi-runtime/$(basename "${archives[0]}")"
            destination=${destination//:/-}
            cp "${archives[0]}" "$destination"
          done
          expected=1
          [[ $GROUP == "source-pair" ]] && expected=2
          (( $(find /tmp/asahi-runtime -maxdepth 1 -type f -name '*.pkg.tar.*' | wc -l) == expected ))
      - name: Upload runtime package group
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asahi-runtime-${{ matrix.group }}
          path: /tmp/asahi-runtime/*.pkg.tar.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  assemble-runtime:
    needs: build-runtime
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: asahi-runtime-*
          path: /tmp/asahi-runtime
          merge-multiple: true
      - name: Install runtime verification tools
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools pacman-package-manager
      - name: Verify exact runtime bundle and installer payload
        run: |
          set -euo pipefail
          (( $(find /tmp/asahi-runtime -maxdepth 1 -type f -name '*.pkg.tar.*' | wc -l) == EXPECTED_RUNTIME_PACKAGE_COUNT ))
          manifest=$(bin/asahi-bundle-manifest /tmp/asahi-runtime)
          source pkgbuilds/omarchy-source.conf
          grep -Fxq "source_commit=$OMARCHY_SOURCE_COMMIT" "$manifest"
          settings=(/tmp/asahi-runtime/omarchy-settings-dev-*.pkg.tar.*)
          (( ${#settings[@]} == 1 ))
          bsdtar -tf "${settings[0]}" | grep -Fxq 'usr/share/omarchy/default/snapper/root'
          bsdtar -tf "${settings[0]}" | grep -Fxq 'etc/snapper/config-templates/omarchy'
          runtime=(/tmp/asahi-runtime/omarchy-dev-*.pkg.tar.*)
          (( ${#runtime[@]} == 1 ))
          bsdtar -xOf "${runtime[0]}" usr/share/omarchy/install/user/mise-work.sh |
            grep -Fq 'aarch64|arm64) NODE_ARCH=arm64'
          bsdtar -xOf "${runtime[0]}" usr/share/omarchy/install/user/mise-work.sh |
            grep -Fq 'x86_64) NODE_ARCH=x64'
          BUNDLE_DIR=/tmp/asahi-runtime .github/scripts/verify-asahi-package-transaction.sh
      - name: Upload verified runtime bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asahi-runtime-bundle
          path: |
            /tmp/asahi-runtime/*.pkg.tar.*
            /tmp/asahi-runtime/asahi-quattro-bundle.manifest
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  assemble:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: asahi-source-*
          path: /tmp/asahi-repository
          merge-multiple: true
      - name: Install package repository tools
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools pacman-package-manager
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prepare cached ARM transaction image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: build
          file: build/Dockerfile
          platforms: linux/arm64
          build-args: MIRROR=edge
          load: true
          tags: omarchy-pkg-builder:latest-aarch64-edge
          cache-from: type=gha,scope=asahi-builder-aarch64-edge-v1
      - name: Validate exact binary package set
        run: |
          set -euo pipefail
          find /tmp/asahi-repository -maxdepth 1 -type f -name '*.pkg.tar.*' -print0 |
            while IFS= read -r -d '' archive; do
              bsdtar -xOf "$archive" .PKGINFO | sed -n 's/^pkgname = //p'
            done | sort > /tmp/actual-packages
          sort pkgbuilds/asahi-repository-packages > /tmp/expected-packages
          diff -u /tmp/expected-packages /tmp/actual-packages
          (( $(find /tmp/asahi-repository -maxdepth 1 -type f -name '*.pkg.tar.*' | wc -l) == EXPECTED_PACKAGE_COUNT ))
      - name: Prepare signed lifecycle repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir /tmp/candidate-repository /tmp/previous-repository
          cp /tmp/asahi-repository/*.pkg.tar.* /tmp/candidate-repository/
          gh release download "$PREVIOUS_PACKAGE_RELEASE" --repo "$GITHUB_REPOSITORY" --dir /tmp/previous-repository
          (
            cd /tmp/previous-repository
            sha256sum --check SHA256SUMS
          )
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/maralcbr/omarchy-mx-mac/46224d32dbdf70003f0620f588182f3852cb36ac/default/omarchy-release.gpg \
            --output /tmp/previous-repository/omarchy-release.gpg
          previous_fingerprint=$(gpg --batch --show-keys --with-colons /tmp/previous-repository/omarchy-release.gpg |
            awk -F: '$1 == "fpr" { print $10; exit }')
          [[ $previous_fingerprint == "$PERSONAL_RELEASE_MASTER_FINGERPRINT" ]]

          export GNUPGHOME=/tmp/transaction-gnupg
          mkdir -m 0700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key 'ARM Candidate Transaction <candidate@example.invalid>' ed25519 sign 1d
          candidate_fingerprint=$(gpg --batch --list-secret-keys --with-colons |
            awk -F: '$1 == "sec" { primary=1; next } primary && $1 == "fpr" { print $10; exit }')
          (
            cd /tmp/candidate-repository
            shopt -s nullglob
            archives=(*.pkg.tar.*)
            (( ${#archives[@]} == EXPECTED_PACKAGE_COUNT ))
            for archive in "${archives[@]}"; do
              gpg --batch --yes --local-user "$candidate_fingerprint!" --detach-sign "$archive"
            done
            repo-add omarchy.db.tar.zst "${archives[@]}"
            for database in omarchy.db.tar.zst omarchy.files.tar.zst; do
              gpg --batch --yes --local-user "$candidate_fingerprint!" --detach-sign "$database"
            done
            cp --remove-destination omarchy.db.tar.zst omarchy.db
            cp --remove-destination omarchy.db.tar.zst.sig omarchy.db.sig
            cp --remove-destination omarchy.files.tar.zst omarchy.files
            cp --remove-destination omarchy.files.tar.zst.sig omarchy.files.sig
            gpg --batch --export "$candidate_fingerprint" >verify-signing-key.gpg
          )
          echo "TRANSACTION_SIGNING_FINGERPRINT=$candidate_fingerprint" >>"$GITHUB_ENV"

          cat >/tmp/candidate-repository/pacman.conf <<'EOF'
          [options]
          Architecture = aarch64
          CacheDir = /var/cache/pacman/candidate
          SigLevel = Required DatabaseOptional
          LocalFileSigLevel = Required

          [omarchy]
          Server = file:///candidate

          [core]
          Include = /etc/pacman.d/mirrorlist

          [extra]
          Include = /etc/pacman.d/mirrorlist

          [alarm]
          Include = /etc/pacman.d/mirrorlist

          [aur]
          Include = /etc/pacman.d/mirrorlist
          EOF

          cat >/tmp/previous-repository/pacman.conf <<'EOF'
          [options]
          Architecture = aarch64
          CacheDir = /var/cache/pacman/previous
          SigLevel = Required DatabaseOptional
          LocalFileSigLevel = Required

          [omarchy]
          Server = file:///previous

          [core]
          Include = /etc/pacman.d/mirrorlist

          [extra]
          Include = /etc/pacman.d/mirrorlist

          [alarm]
          Include = /etc/pacman.d/mirrorlist

          [aur]
          Include = /etc/pacman.d/mirrorlist
          EOF
      - name: Run signed clean-install and upgrade lifecycles
        run: |
          set -euo pipefail
          common_mounts=(
            -v "$GITHUB_WORKSPACE:/workspace:ro"
            -v /tmp/candidate-repository:/candidate:ro
            -v /tmp/previous-repository:/previous:ro
          )
          docker run --rm "${common_mounts[@]}" \
            -e CANDIDATE_FINGERPRINT="$TRANSACTION_SIGNING_FINGERPRINT" \
            omarchy-pkg-builder:latest-aarch64-edge \
            /workspace/.github/scripts/verify-asahi-repository-lifecycle.sh clean |
            tee /tmp/asahi-repository/transaction-clean.log
          docker run --rm "${common_mounts[@]}" \
            -e CANDIDATE_FINGERPRINT="$TRANSACTION_SIGNING_FINGERPRINT" \
            omarchy-pkg-builder:latest-aarch64-edge \
            /workspace/.github/scripts/verify-asahi-repository-lifecycle.sh upgrade |
            tee /tmp/asahi-repository/transaction-upgrade.log
          grep -hE '^[0-9a-f]{64}  /var/lib/pacman/sync/[^ ]+\.db$' \
            /tmp/asahi-repository/transaction-{clean,upgrade}.log |
            sort -u > /tmp/asahi-repository/transaction-repositories.sha256
          [[ -s /tmp/asahi-repository/transaction-repositories.sha256 ]]
      - name: Upload verified repository packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asahi-package-repository
          path: |
            /tmp/asahi-repository/*.pkg.tar.*
            /tmp/asahi-repository/transaction-clean.log
            /tmp/asahi-repository/transaction-upgrade.log
            /tmp/asahi-repository/transaction-repositories.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    if: inputs.mode == 'publish'
    needs:
      - assemble
      - assemble-runtime
    runs-on: ubuntu-24.04-arm
    environment: asahi-quattro-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: asahi-package-repository
          path: /tmp/asahi-repository
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: asahi-runtime-bundle
          path: /tmp/asahi-runtime
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools pacman-package-manager
      - name: Import and validate dedicated ARM signing subkey
        env:
          ARM_REPOSITORY_SIGNING_SUBKEY: ${{ secrets.OMARCHY_ARM_REPOSITORY_SIGNING_SUBKEY }}
          ARM_REPOSITORY_SIGNING_FINGERPRINT: ${{ vars.OMARCHY_ARM_REPOSITORY_SIGNING_FINGERPRINT }}
          GPG_PASSPHRASE: ${{ secrets.OMARCHY_ARM_REPOSITORY_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ ${ARM_REPOSITORY_SIGNING_FINGERPRINT^^} =~ ^[A-F0-9]{40}$ ]]
          ARM_REPOSITORY_SIGNING_FINGERPRINT=${ARM_REPOSITORY_SIGNING_FINGERPRINT^^}
          printf '%s' "$ARM_REPOSITORY_SIGNING_SUBKEY" | gpg --batch --import
          bin/asahi-signing-subkey-validate "$ARM_REPOSITORY_SIGNING_FINGERPRINT" "$PERSONAL_RELEASE_MASTER_FINGERPRINT"
          echo "RELEASE_KEY_FINGERPRINT=$ARM_REPOSITORY_SIGNING_FINGERPRINT" >>"$GITHUB_ENV"
      - name: Sign packages, repository metadata, and candidate descriptor
        env:
          GPG_PASSPHRASE: ${{ secrets.OMARCHY_ARM_REPOSITORY_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd /tmp/asahi-repository
          shopt -s nullglob
          archives=(*.pkg.tar.*)
          (( ${#archives[@]} == EXPECTED_PACKAGE_COUNT ))
          for archive in "${archives[@]}"; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$RELEASE_KEY_FINGERPRINT!" --detach-sign "$archive"
            gpg --batch --verify "$archive.sig" "$archive"
          done
          repo-add omarchy.db.tar.zst "${archives[@]}"
          for database in omarchy.db.tar.zst omarchy.files.tar.zst; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$RELEASE_KEY_FINGERPRINT!" --detach-sign "$database"
            gpg --batch --verify "$database.sig" "$database"
          done
          cp --remove-destination omarchy.db.tar.zst omarchy.db
          cp --remove-destination omarchy.db.tar.zst.sig omarchy.db.sig
          cp --remove-destination omarchy.files.tar.zst omarchy.files
          cp --remove-destination omarchy.files.tar.zst.sig omarchy.files.sig
          release_tag="asahi-packages-candidate-$GITHUB_SHA"
          "$GITHUB_WORKSPACE/bin/asahi-package-candidate-descriptor" "$PWD" "$release_tag" "$GITHUB_SHA" "$RELEASE_KEY_FINGERPRINT" "$GITHUB_RUN_ID" > CANDIDATE
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$RELEASE_KEY_FINGERPRINT!" --detach-sign CANDIDATE
          gpg --batch --verify CANDIDATE.sig CANDIDATE
          sha256sum *.pkg.tar.* omarchy.db omarchy.db.sig omarchy.files omarchy.files.sig transaction-clean.log transaction-upgrade.log transaction-repositories.sha256 CANDIDATE CANDIDATE.sig >SHA256SUMS
          echo "CANDIDATE_SHA256=$(sha256sum CANDIDATE | cut -d' ' -f1)" >>"$GITHUB_ENV"
          cd /tmp/asahi-runtime
          shopt -s nullglob
          runtime_archives=(*.pkg.tar.*)
          (( ${#runtime_archives[@]} == EXPECTED_RUNTIME_PACKAGE_COUNT ))
          for archive in "${runtime_archives[@]}"; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$RELEASE_KEY_FINGERPRINT!" --detach-sign "$archive"
            gpg --batch --verify "$archive.sig" "$archive"
          done
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$RELEASE_KEY_FINGERPRINT!" --detach-sign asahi-quattro-bundle.manifest
          gpg --batch --verify asahi-quattro-bundle.manifest.sig asahi-quattro-bundle.manifest
          sha256sum *.pkg.tar.* asahi-quattro-bundle.manifest asahi-quattro-bundle.manifest.sig >RUNTIME-SHA256SUMS
          echo "RUNTIME_MANIFEST_SHA256=$(sha256sum asahi-quattro-bundle.manifest | cut -d' ' -f1)" >>"$GITHUB_ENV"
      - name: Publish immutable candidate prerelease
        env:
          GH_TOKEN: ${{ secrets.OMARCHY_REPOSITORY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="asahi-packages-candidate-$GITHUB_SHA"
          [[ $release_tag == "asahi-packages-candidate-$GITHUB_SHA" ]]
          [[ -n $GH_TOKEN ]]
          if ! immutable_enabled=$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled); then
            echo "::error::OMARCHY_REPOSITORY_ADMIN_TOKEN must be valid and have Administration read permission" >&2
            exit 1
          fi
          if [[ $immutable_enabled != "true" ]]; then
            echo "::error::Immutable releases must be enabled before candidate publication" >&2
            exit 1
          fi
          ! gh release view "$release_tag" >/dev/null 2>&1
          gh release create "$release_tag" /tmp/asahi-repository/*.pkg.tar.* /tmp/asahi-repository/omarchy.db /tmp/asahi-repository/omarchy.db.sig /tmp/asahi-repository/omarchy.files /tmp/asahi-repository/omarchy.files.sig /tmp/asahi-repository/transaction-clean.log /tmp/asahi-repository/transaction-upgrade.log /tmp/asahi-repository/transaction-repositories.sha256 /tmp/asahi-repository/CANDIDATE /tmp/asahi-repository/CANDIDATE.sig /tmp/asahi-repository/SHA256SUMS /tmp/asahi-runtime/*.pkg.tar.* /tmp/asahi-runtime/asahi-quattro-bundle.manifest /tmp/asahi-runtime/asahi-quattro-bundle.manifest.sig /tmp/asahi-runtime/RUNTIME-SHA256SUMS --target "$GITHUB_SHA" --title "Apple Silicon package candidate $GITHUB_SHA" --notes "Immutable signed aarch64 candidate from $GITHUB_SHA. Repository descriptor SHA-256: $CANDIDATE_SHA256. Runtime manifest SHA-256: $RUNTIME_MANIFEST_SHA256" --prerelease --latest=false
          [[ $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" --jq .prerelease) == "true" ]]
          [[ $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" --jq .immutable) == "true" ]]
          gh release verify "$release_tag"
      - name: Verify public candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="asahi-packages-candidate-$GITHUB_SHA"
          mkdir /tmp/public-repository
          gh release download "$release_tag" --dir /tmp/public-repository
          cd /tmp/public-repository
          sha256sum --check SHA256SUMS
          sha256sum --check RUNTIME-SHA256SUMS
          [[ $(sha256sum CANDIDATE | cut -d' ' -f1) == "$CANDIDATE_SHA256" ]]
          [[ $(sha256sum asahi-quattro-bundle.manifest | cut -d' ' -f1) == "$RUNTIME_MANIFEST_SHA256" ]]
          gpg --batch --verify CANDIDATE.sig CANDIDATE
          gpg --batch --verify asahi-quattro-bundle.manifest.sig asahi-quattro-bundle.manifest
          (( $(find . -maxdepth 1 -type f -name '*.pkg.tar.*' ! -name '*.sig' | wc -l) == EXPECTED_PACKAGE_COUNT + EXPECTED_RUNTIME_PACKAGE_COUNT ))
