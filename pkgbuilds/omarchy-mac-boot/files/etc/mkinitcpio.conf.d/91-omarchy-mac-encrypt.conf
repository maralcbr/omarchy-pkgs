# Insert the in-place encrypt hook after vendorfw/block and sd-encrypt
# immediately before filesystems. 90-omarchy-asahi.conf already put asahi
# and omarchy-vendorfw before filesystems; this drop-in is sourced after it.
_omarchy_mac_encrypt_hooks=()
_omarchy_mac_encrypt_added=false
for _omarchy_mac_encrypt_hook in "${HOOKS[@]}"; do
  if [[ $_omarchy_mac_encrypt_hook == omarchy-mac-encrypt || $_omarchy_mac_encrypt_hook == sd-encrypt ]]; then
    _omarchy_mac_encrypt_added=true
  fi
  if [[ $_omarchy_mac_encrypt_hook == filesystems && $_omarchy_mac_encrypt_added == false ]]; then
    _omarchy_mac_encrypt_hooks+=(omarchy-mac-encrypt sd-encrypt)
    _omarchy_mac_encrypt_added=true
  fi
  _omarchy_mac_encrypt_hooks+=("$_omarchy_mac_encrypt_hook")
done
if [[ $_omarchy_mac_encrypt_added == false ]]; then
  _omarchy_mac_encrypt_hooks+=(omarchy-mac-encrypt sd-encrypt)
fi
HOOKS=("${_omarchy_mac_encrypt_hooks[@]}")
unset _omarchy_mac_encrypt_hooks _omarchy_mac_encrypt_hook _omarchy_mac_encrypt_added
